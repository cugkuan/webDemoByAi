server:
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  mode: debug

database:
  dsn: "root@tcp(127.0.0.1:3306)/task_db?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

cache:
  l1_ttl: 30s
  l2_ttl: 5m

log:
  level: info
  format: text

rate:
  enabled: true
  requests: 100
  per_sec: 1.0
